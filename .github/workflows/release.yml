name: Release

# Se dispara al publicar un tag de versión (ej. v1.2.0). electron-builder construye
# el instalador de Windows y lo publica como asset del GitHub Release de ese tag,
# junto con el archivo latest.yml que electron-updater usa para detectar versiones.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Algunas dependencias transitivas (ej. @electron/node-gyp, usada por
      # @electron/rebuild) quedan resueltas en package-lock.json con protocolo
      # git+ssh://, que requiere una llave SSH inexistente en el runner. Se
      # reescribe a HTTPS (acceso anónimo, funciona para repos públicos) antes
      # de instalar.
      - name: Forzar git sobre HTTPS para dependencias
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y publicar release
        run: npm run release
        env:
          # Token automático de GitHub Actions: se usa solo aquí, en el runner de CI,
          # para SUBIR los artefactos al release de este mismo repositorio.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
